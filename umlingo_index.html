<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엄링고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2433;--mute:#7b8194;--line:#e4e7ef;--pri:#5b5bd6;--pri-d:#4343b8;--pri-l:#ececff;--ok:#16a34a;--ok-l:#dcfce7;--bad:#e5484d;--bad-l:#fee2e2;--gold:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.logo{font-weight:900;font-size:24px;color:var(--pri);letter-spacing:-.5px}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0}
.stats{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:700;font-size:14px}
.home{padding:8px 20px 40px}
h2{font-size:15px;color:var(--mute);margin:22px 0 10px;font-weight:700}
.cat{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:16px;margin-bottom:12px;transition:.12s}
.cat:hover{border-color:var(--pri)}
.cat:active{transform:translateY(2px);border-bottom-width:2px}
.cat .ic{flex:0 0 52px;height:52px;border-radius:14px;background:var(--pri-l);display:grid;place-items:center;font-size:24px;font-weight:900;color:var(--pri)}
.cat b{font-size:17px;display:block}
.cat span.d{font-size:13px;color:var(--mute);line-height:1.45}
.cat .bar{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{padding:8px 13px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.day.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri-d)}
.day small{font-weight:500;color:var(--mute);margin-left:3px}
.note{font-size:12px;color:var(--mute);margin-top:18px;text-align:center;line-height:1.6}
/* lesson */
.lesson{display:flex;flex-direction:column;flex:1}
.lt{display:flex;align-items:center;gap:14px;padding:18px 20px 6px}
.x{font-size:26px;color:var(--mute);line-height:1;padding:2px 6px}
.prog{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);border-radius:99px;transition:width .35s}
.hearts{font-weight:900;color:var(--bad);font-size:16px;min-width:46px;text-align:right}
.q{flex:1;padding:18px 22px 150px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--pri-l);color:var(--pri-d);margin-bottom:12px}
.inst{font-size:20px;font-weight:900;margin:0 0 16px;line-height:1.4}
.sent{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;font-size:17px;line-height:1.75;margin-bottom:10px;font-family:'Noto Sans KR',sans-serif}
.sent .n{display:inline-block;font-weight:900;color:var(--pri);margin-right:6px}
.sent u{text-decoration:none;font-weight:900;background:linear-gradient(transparent 62%,#c9c9ff 62%);padding:0 2px}
.blank{display:inline-block;min-width:78px;border-bottom:3px solid var(--ink);text-align:center;font-weight:900;color:var(--pri-d);margin:0 2px;line-height:1.2}
.blank.f{border-color:var(--ok);color:var(--ok)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font-size:17px;font-weight:500}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute)}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.sel .k{border-color:var(--pri);color:var(--pri);background:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.ok .k{border-color:var(--ok);color:#fff;background:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bad-l)}
.opt.no .k{border-color:var(--bad);color:#fff;background:var(--bad)}
.opt:disabled{cursor:default}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:16px 20px calc(18px + env(safe-area-inset-bottom));z-index:5}
.sheet .in{max-width:520px;margin:0 auto}
.sheet.ok{background:var(--ok-l);border-color:#bbf7d0}
.sheet.no{background:var(--bad-l);border-color:#fecaca}
.fb{font-weight:900;font-size:19px;margin-bottom:4px}
.sheet.ok .fb{color:var(--ok)}.sheet.no .fb{color:var(--bad)}
.ex{font-size:14px;line-height:1.55;margin-bottom:12px;color:#334}
.ex small{color:var(--mute);display:block;margin-top:2px}
.btn{width:100%;padding:15px;border-radius:14px;font-weight:900;font-size:16px;color:#fff;background:var(--pri);border-bottom:4px solid var(--pri-d);letter-spacing:.3px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{background:var(--line);border-color:#cfd3df;color:#a2a8b8;cursor:default;transform:none}
.sheet.ok .btn{background:var(--ok);border-color:#15803d}
.sheet.no .btn{background:var(--bad);border-color:#b91c1c}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--line);border-bottom-width:4px;margin-top:10px}
/* result */
.res{padding:50px 24px;text-align:center;flex:1}
.res .big{font-size:64px}
.res h1{font-size:26px;margin:10px 0 4px}
.res p{color:var(--mute);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.box{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 6px}
.box b{display:block;font-size:22px}
.box span{font-size:12px;color:var(--mute);font-weight:700}
.wrong{text-align:left;margin:0 0 22px}
.wrong div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.wrong b{color:var(--pri-d)}
</style>
</head>

 var h='<div class="res"><div class="big">'+(failed?'💔':(L.ok===total?'🏆':'🎉'))+'</div><h1>'+(failed?'하트를 모두 잃었어요':(L.ok===total?'퍼펙트!':'레슨 완료!'))+'</h1><p>'+(failed?'다시 도전해서 단어를 복습해봐요.':'오늘도 한 걸음 더 가까워졌어요.')+'</p>';
 h+='<div class="grid"><div class="box"><b>'+L.ok+'/'+total+'</b><span>정답</span></div><div class="box"><b>+'+xp+'</b><span>XP</span></div><div class="box"><b>🔥 '+S.streak+'</b><span>연속 학습</span></div></div>';
 if(L.wrong.length){h+='<h2 style="text-align:left">복습할 단어</h2><div class="wrong">'+L.wrong.map(function(i){return '<div><b>'+i.t+'</b></div>'}).join('')+'</div>'}
 h+='<button class="btn" id="again">같은 유형 다시 풀기</button><button class="btn ghost" id="home">홈으로</button></div>';
 APP.innerHTML=h;var k=L.kind;
 document.getElementById('again').onclick=function(){start(k)};
 document.getElementById('home').onclick=function(){L=null;home()};
 window.scrollTo(0,0);
}
document.addEventListener('keydown',function(e){
 if(!L)return;
 if(e.key>='1'&&e.key<='5'&&!L.checked)choose(+e.key-1);
 if(e.key==='Enter'){var b=document.getElementById('chk');if(b&&!b.disabled)check()}
});
load();
APP.innerHTML=hdr()+'<div class="home"><p class="note">불러오는 중…</p></div>';
ITEMS=DATA;home();
})();
</script>
